<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store - Cart</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eeeeee;
        }

        header {
            height: 160px;
            background: linear-gradient(to right, #ff9900, #ffb300);
            text-align: center;
            padding-top: 25px;
            border-bottom: 3px solid #999;
        }

        header h1 {
            margin: 10px;
            color: #333;
        }

        nav {
            margin-top: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 0 18px;
            border-right: 1px solid #555;
        }

        nav a:last-child {
            border-right: none;
        }

        .main-container {
            display: flex;
            min-height: 450px;
        }

        .sidebar {
            width: 25%;
            min-width: 200px;
            background: linear-gradient(#ffcc33, #ff9900);
            padding: 25px;
            border-right: 2px solid #999;
        }

        .sidebar h3 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            background: rgba(255,255,255,0.4);
            color: #333;
            font-weight: bold;
        }

        .content {
            width: 75%;
            padding: 35px 20px;
            overflow-x: auto;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #ff9900;
            color: white;
            padding: 12px;
        }

        td {
            text-align: center;
            padding: 12px;
            border-bottom: 1px solid #ccc;
        }

        .book-cover {
            width: 60px;
            height: 75px;
            background: #334;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            padding: 5px;
        }

        button {
            padding: 7px 12px;
            background: #ff9900;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .remove {
            background: #d9534f;
        }

        .total {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            font-size: 16px;
        }

        footer {
            background: linear-gradient(to right, #ff6600, #ffcc00);
            text-align: center;
            color: white;
            padding: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 G.L. Bajaj Online Book Store</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>


    <div class="main-container">

        <aside class="sidebar">
            <h3>Categories</h3>

            <a href="catalogue.html">CSE Books</a>
            <a href="catalogue.html">ECE Books</a>
            <a href="catalogue.html">Mechanical Books</a>
        </aside>


        <main class="content">

            <h2>Shopping Cart</h2>

            <table>

                <thead>
                    <tr>
                        <th>Cover</th>
                        <th>Book Name</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="cartItems"></tbody>

            </table>


            <div class="total">
                Total Price: Rs. <span id="totalPrice">0</span>
            </div>


            <button class="checkout"
                    onclick="checkout()">
                Proceed to Checkout
            </button>

        </main>

    </div>


    <footer>
        © Created by Sanskriti Jain Roll no: 2501920110329
    </footer>


    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];


        function displayCart() {

            let cartItems = document.getElementById("cartItems");

            cartItems.innerHTML = "";

            let total = 0;


            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <tr>
                        <td colspan="7">
                            Your cart is empty.
                        </td>
                    </tr>
                `;

            } else {

                cart.forEach(function(book, index) {

                    let amount = book.price * book.quantity;

                    total += amount;

                    cartItems.innerHTML += `

                        <tr>

                            <td>
                                <div class="book-cover">
                                    ${book.cover}
                                </div>
                            </td>

                            <td>${book.name}</td>

                            <td>${book.author}</td>

                            <td>Rs. ${book.price}</td>

                            <td>

                                <button onclick="changeQuantity(${index}, -1)">
                                    -
                                </button>

                                ${book.quantity}

                                <button onclick="changeQuantity(${index}, 1)">
                                    +
                                </button>

                            </td>

                            <td>
                                Rs. ${amount}
                            </td>

                            <td>

                                <button class="remove"
                                    onclick="removeBook(${index})">

                                    Remove

                                </button>

                            </td>

                        </tr>
                    `;
                });
            }

            document.getElementById("totalPrice").innerText = total;

            localStorage.setItem("cart", JSON.stringify(cart));
        }


        function changeQuantity(index, value) {

            cart[index].quantity += value;

            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            displayCart();
        }


        function removeBook(index) {

            cart.splice(index, 1);

            displayCart();
        }


        function checkout() {

            if (cart.length === 0) {
                alert("Your cart is empty!");
            } else {
                alert("Order placed successfully!");

                cart = [];

                localStorage.setItem("cart", JSON.stringify(cart));

                displayCart();
            }
        }


        displayCart();

    </script>

</body>
</html>
