<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store - Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eeeeee;
        }

        header {
            height: 160px;
            background: linear-gradient(to right, #ff9900, #ffb300);
            text-align: center;
            padding-top: 25px;
            border-bottom: 3px solid #999;
        }

        header h1 {
            margin: 10px;
            color: #333;
        }

        nav {
            margin-top: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 0 18px;
            border-right: 1px solid #555;
        }

        nav a:last-child {
            border-right: none;
        }

        .main-container {
            display: flex;
        }

        .sidebar {
            width: 25%;
            min-width: 200px;
            background: linear-gradient(#ffcc33, #ff9900);
            padding: 25px;
            border-right: 2px solid #999;
        }

        .sidebar h3 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            background: rgba(255,255,255,0.4);
            color: #333;
            font-weight: bold;
        }

        .content {
            width: 75%;
            padding: 40px 20px;
        }

        .form-box {
            width: 500px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            box-shadow: 0 2px 10px #aaa;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        .inline label {
            display: inline;
            margin-right: 15px;
            font-weight: normal;
        }

        .dob {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        select {
            padding: 8px;
            flex: 1;
        }

        textarea {
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #ff9900;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            background: linear-gradient(to right, #ff6600, #ffcc00);
            text-align: center;
            color: white;
            padding: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 G.L. Bajaj Online Book Store</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <div class="main-container">

        <aside class="sidebar">
            <h3>Categories</h3>

            <a href="catalogue.html">CSE Books</a>
            <a href="catalogue.html">ECE Books</a>
            <a href="catalogue.html">Mechanical Books</a>
        </aside>

        <main class="content">

            <div class="form-box">

                <h2>Registration Form</h2>

                <form>

                    <label>Name</label>
                    <input type="text" required>

                    <label>Password</label>
                    <input type="password" required>

                    <label>E-mail ID</label>
                    <input type="email" required>

                    <label>Phone Number</label>
                    <input type="text" required>


                    <label>Sex</label>

                    <div class="inline">
                        <label>
                            <input type="radio" name="sex"> Male
                        </label>

                        <label>
                            <input type="radio" name="sex"> Female
                        </label>
                    </div>


                    <label>Date of Birth</label>

                    <div class="dob">

                        <select>
                            <option>Day</option>
                            <script>
                                for (let i = 1; i <= 31; i++) {
                                    document.write("<option>" + i + "</option>");
                                }
                            </script>
                        </select>

                        <select>
                            <option>Month</option>
                            <option>January</option>
                            <option>February</option>
                            <option>March</option>
                            <option>April</option>
                            <option>May</option>
                            <option>June</option>
                            <option>July</option>
                            <option>August</option>
                            <option>September</option>
                            <option>October</option>
                            <option>November</option>
                            <option>December</option>
                        </select>

                        <select>
                            <option>Year</option>
                            <script>
                                for (let i = 2026; i >= 1980; i--) {
                                    document.write("<option>" + i + "</option>");
                                }
                            </script>
                        </select>

                    </div>


                    <label>Languages Known</label>

                    <div class="inline">
                        <label>
                            <input type="checkbox"> English
                        </label>

                        <label>
                            <input type="checkbox"> Telugu
                        </label>

                        <label>
                            <input type="checkbox"> Hindi
                        </label>

                        <label>
                            <input type="checkbox"> Tamil
                        </label>
                    </div>


                    <label>Address</label>
                    <textarea></textarea>


                    <button type="submit">Register</button>

                </form>

            </div>

        </main>

    </div>

    <footer>
        © Online Book Store Project
    </footer>

</body>
</html>
