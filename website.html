<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Div Example</title>
    <style>
        /* Style for header section */
        .header {
            background-color: #4cacaf;
            color: rgb(255, 255, 255);
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }

        /* Style for content section */
        .content {
            background-color: #f9f9f9;
            padding: 20px;
            font-size: 18px;
        }

        /* Style for footer section */
        .footer {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        My Website Header
    </div>

    <!-- Content Section -->
    <div class="content">
        <p>Welcome to my website! This is the main content area.</p>
    
    </div>

    <!-- Footer Section -->
    <div class="footer">
        2026 My Website. All rights reserved.
    </div>

</body>
</html>
