<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store - Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eeeeee;
        }

        header {
            height: 160px;
            background: linear-gradient(to right, #ff9900, #ffb300);
            text-align: center;
            padding-top: 25px;
            border-bottom: 3px solid #999;
        }

        header h1 {
            margin: 10px;
            color: #333;
        }

        nav {
            margin-top: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 0 18px;
            border-right: 1px solid #555;
        }

        nav a:last-child {
            border-right: none;
        }

        .main-container {
            display: flex;
            min-height: 450px;
        }

        .sidebar {
            width: 25%;
            min-width: 200px;
            background: linear-gradient(#ffcc33, #ff9900);
            padding: 25px;
            border-right: 2px solid #999;
        }

        .sidebar h3 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            background: rgba(255,255,255,0.4);
            color: #333;
            font-weight: bold;
        }

        .content {
            width: 75%;
            padding: 60px 20px;
        }

        .login-box {
            width: 400px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px #aaa;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            background: linear-gradient(to right, #ff6600, #ffcc00);
            text-align: center;
            color: white;
            padding: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 G.L. Bajaj Online Book Store</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <div class="main-container">

        <aside class="sidebar">
            <h3>Categories</h3>

            <a href="catalogue.html">CSE Books</a>
            <a href="catalogue.html">ECE Books</a>
            <a href="catalogue.html">Mechanical Books</a>
        </aside>

        <main class="content">

            <div class="login-box">

                <h2>Login Page</h2>

                <form>
                    <input type="text"
                           placeholder="Enter Username"
                           required>

                    <input type="password"
                           placeholder="Enter Password"
                           required>

                    <button type="submit">Login</button>
                </form>

            </div>

        </main>

    </div>

    <footer>
        Created by Sanskriti Jain Roll no: 2501920110329
    </footer>

</body>
</html>
